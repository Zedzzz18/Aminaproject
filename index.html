<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Tâches — Perso &amp; Pro</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --accent:#4f46e5; --accent-light:#eef2ff;
    --red:#dc2626; --red-bg:#fee2e2;
    --orange:#d97706; --orange-bg:#fef3c7;
    --green:#16a34a; --green-bg:#dcfce7;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.4;
  }
  .wrap{max-width:900px; margin:0 auto; padding:24px 16px 80px;}
  header{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin:0;}
  .status{font-size:12px; padding:4px 10px; border-radius:999px; background:var(--green-bg); color:var(--green); font-weight:600;}
  .status.offline{background:var(--red-bg); color:var(--red);}
  button{
    font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--card);
    color:var(--ink); border-radius:8px; padding:8px 12px; font-size:13px; transition:background .15s;
  }
  button:hover{background:var(--accent-light);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{background:#4338ca;}
  button.ghost{border:none; background:transparent; padding:4px 6px;}
  .summary{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .chip{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:13px; min-width:110px;}
  .chip b{display:block; font-size:20px; margin-bottom:2px;}
  .chip.red b{color:var(--red);} .chip.orange b{color:var(--orange);} .chip.green b{color:var(--green);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;}
  .form-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px;}
  .form-grid input, .form-grid select{font:inherit; padding:8px 10px; border:1px solid var(--border); border-radius:8px; width:100%; background:#fff; color:var(--ink);}
  .form-row2{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-top:8px;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filters input[type=text]{flex:1; min-width:160px; font:inherit; padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:#fff;}
  .filter-btn{padding:6px 12px; border-radius:999px; font-size:13px;}
  .filter-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .task{display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
  .task.done{opacity:.55;}
  .task.overdue{border-left:4px solid var(--red);}
  .task.today{border-left:4px solid var(--orange);}
  .task input[type=checkbox]{width:18px; height:18px; margin-top:2px; cursor:pointer; flex-shrink:0;}
  .task-body{flex:1; min-width:0;}
  .task-title{font-size:14.5px; font-weight:500; word-break:break-word;}
  .task.done .task-title{text-decoration:line-through;}
  .task-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .tag{font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600;}
  .tag.perso{background:#ede9fe; color:#6d28d9;}
  .tag.pro{background:#dbeafe; color:#1d4ed8;}
  .tag.prio-haute{background:var(--red-bg); color:var(--red);}
  .tag.prio-moyenne{background:var(--orange-bg); color:var(--orange);}
  .tag.prio-basse{background:var(--green-bg); color:var(--green);}
  .tag.date{background:#f3f4f6; color:#374151;}
  .tag.recur{background:#f3f4f6; color:#374151;}
  .task-actions{display:flex; gap:2px; flex-shrink:0;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 0;}
  footer{color:var(--muted); font-size:12px; text-align:center; margin-top:30px;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} .form-row2{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mes Tâches</h1>
      <p class="sub">Perso &amp; Pro — synchronisé en temps réel</p>
    </div>
    <span class="status" id="status">Connexion…</span>
  </header>

  <div class="summary" id="summary"></div>

  <div class="card">
    <div class="form-grid">
      <input type="text" id="inpTitle" placeholder="Nouvelle tâche… (ex: Appeler le comptable)">
      <select id="inpType">
        <option value="perso">Perso</option>
        <option value="pro">Pro</option>
      </select>
      <input type="text" id="inpProject" placeholder="Projet (optionnel)">
    </div>
    <div class="form-row2">
      <select id="inpPriority">
        <option value="haute">Priorité haute</option>
        <option value="moyenne" selected>Priorité moyenne</option>
        <option value="basse">Priorité basse</option>
      </select>
      <input type="date" id="inpDate">
      <select id="inpRecur">
        <option value="none">Ne se répète pas</option>
        <option value="daily">Tous les jours</option>
        <option value="weekly">Toutes les semaines</option>
        <option value="monthly">Tous les mois</option>
      </select>
      <button class="primary" id="btnAdd">+ Ajouter</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Toutes</button>
    <button class="filter-btn" data-filter="today">Aujourd'hui</button>
    <button class="filter-btn" data-filter="overdue">En retard</button>
    <button class="filter-btn" data-filter="week">Cette semaine</button>
    <button class="filter-btn" data-filter="perso">Perso</button>
    <button class="filter-btn" data-filter="pro">Pro</button>
    <button class="filter-btn" data-filter="done">Terminées</button>
    <input type="text" id="search" placeholder="Rechercher…">
  </div>

  <div id="taskList"></div>

  <footer>Synchronisé via Firebase — accessible depuis tous tes appareils.</footer>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// ⚠️ Configuration Firebase — remplacée automatiquement lors de la mise en place
const firebaseConfig = {
  apiKey: "AIzaSyBnW79HxzlghxnzrTVmzKVDUT8r4HGBrPc",
  authDomain: "aminaproject-cbdb7.firebaseapp.com",
  projectId: "aminaproject-cbdb7",
  storageBucket: "aminaproject-cbdb7.firebasestorage.app",
  messagingSenderId: "778444862481",
  appId: "1:778444862481:web:7a258b1c81063dce8f2db0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const tasksRef = db.collection('tasks');

let tasks = [];
let currentFilter = 'all';

function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addMonths(dateStr, n){ const d = new Date(dateStr + 'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function nextRecurrenceDate(dateStr, recur){
  if(!dateStr) dateStr = todayStr();
  if(recur === 'daily') return addDays(dateStr, 1);
  if(recur === 'weekly') return addDays(dateStr, 7);
  if(recur === 'monthly') return addMonths(dateStr, 1);
  return null;
}

// Real-time listener
tasksRef.onSnapshot(snapshot => {
  tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  render();
  setStatus(true);
}, err => {
  console.error(err);
  setStatus(false);
});

function setStatus(online){
  const el = document.getElementById('status');
  if(online){ el.textContent = '● Synchronisé'; el.classList.remove('offline'); }
  else { el.textContent = '● Hors ligne'; el.classList.add('offline'); }
}

function addTask(){
  const title = document.getElementById('inpTitle').value.trim();
  if(!title){ document.getElementById('inpTitle').focus(); return; }
  const task = {
    title,
    type: document.getElementById('inpType').value,
    project: document.getElementById('inpProject').value.trim(),
    priority: document.getElementById('inpPriority').value,
    dueDate: document.getElementById('inpDate').value || '',
    recur: document.getElementById('inpRecur').value,
    done: false,
    createdAt: new Date().toISOString()
  };
  tasksRef.add(task);
  document.getElementById('inpTitle').value = '';
  document.getElementById('inpProject').value = '';
  document.getElementById('inpDate').value = '';
  document.getElementById('inpTitle').focus();
}

function toggleDone(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  const newDone = !t.done;
  tasksRef.doc(id).update({ done: newDone });
  if(newDone && t.recur && t.recur !== 'none'){
    const nextDate = nextRecurrenceDate(t.dueDate, t.recur);
    tasksRef.add({
      title: t.title, type: t.type, project: t.project || '',
      priority: t.priority, dueDate: nextDate, recur: t.recur,
      done: false, createdAt: new Date().toISOString()
    });
  }
}

function deleteTask(id){ tasksRef.doc(id).delete(); }

function editTask(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  const newTitle = prompt('Modifier la tâche :', t.title);
  if(newTitle === null) return;
  tasksRef.doc(id).update({ title: newTitle.trim() || t.title });
}

function priorityRank(p){ return p === 'haute' ? 0 : p === 'moyenne' ? 1 : 2; }

function matchesFilter(t){
  const today = todayStr();
  const search = document.getElementById('search').value.trim().toLowerCase();
  if(search && !(t.title.toLowerCase().includes(search) || (t.project||'').toLowerCase().includes(search))) return false;
  switch(currentFilter){
    case 'today': return !t.done && t.dueDate === today;
    case 'overdue': return !t.done && t.dueDate && t.dueDate < today;
    case 'week': { if(t.done || !t.dueDate) return false; const in7 = addDays(today,7); return t.dueDate >= today && t.dueDate <= in7; }
    case 'perso': return t.type === 'perso' && !t.done;
    case 'pro': return t.type === 'pro' && !t.done;
    case 'done': return t.done;
    default: return !t.done;
  }
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render(){
  const today = todayStr();
  const list = document.getElementById('taskList');
  const filtered = tasks.filter(matchesFilter).sort((a,b) => {
    if((a.dueDate||'') !== (b.dueDate||'')) return (a.dueDate||'9999') > (b.dueDate||'9999') ? 1 : -1;
    return priorityRank(a.priority) - priorityRank(b.priority);
  });

  list.innerHTML = '';
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">Aucune tâche ici. 🎉</div>';
  } else {
    filtered.forEach(t => {
      const div = document.createElement('div');
      let cls = 'task';
      if(t.done) cls += ' done';
      else if(t.dueDate && t.dueDate < today) cls += ' overdue';
      else if(t.dueDate === today) cls += ' today';
      div.className = cls;

      let dateLabel = '';
      if(t.dueDate){
        if(t.dueDate < today && !t.done) dateLabel = '⚠ ' + t.dueDate + ' (en retard)';
        else if(t.dueDate === today) dateLabel = "📅 Aujourd'hui";
        else dateLabel = '📅 ' + t.dueDate;
      }
      const recurLabels = {daily:'🔁 Quotidien', weekly:'🔁 Hebdo', monthly:'🔁 Mensuel'};

      div.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone('${t.id}')">
        <div class="task-body">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-meta">
            <span class="tag ${t.type}">${t.type === 'perso' ? 'Perso' : 'Pro'}</span>
            <span class="tag prio-${t.priority}">${t.priority}</span>
            ${t.project ? `<span class="tag date">${escapeHtml(t.project)}</span>` : ''}
            ${dateLabel ? `<span class="tag date">${dateLabel}</span>` : ''}
            ${t.recur && t.recur !== 'none' ? `<span class="tag recur">${recurLabels[t.recur]}</span>` : ''}
          </div>
        </div>
        <div class="task-actions">
          <button class="ghost" title="Modifier" onclick="editTask('${t.id}')">✏️</button>
          <button class="ghost" title="Supprimer" onclick="deleteTask('${t.id}')">🗑️</button>
        </div>
      `;
      list.appendChild(div);
    });
  }
  renderSummary();
}

function renderSummary(){
  const today = todayStr();
  const overdue = tasks.filter(t => !t.done && t.dueDate && t.dueDate < today).length;
  const dueToday = tasks.filter(t => !t.done && t.dueDate === today).length;
  const openCount = tasks.filter(t => !t.done).length;
  const doneCount = tasks.filter(t => t.done).length;
  document.getElementById('summary').innerHTML = `
    <div class="chip red"><b>${overdue}</b>En retard</div>
    <div class="chip orange"><b>${dueToday}</b>Aujourd'hui</div>
    <div class="chip"><b>${openCount}</b>À faire</div>
    <div class="chip green"><b>${doneCount}</b>Terminées</div>
  `;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('btnAdd').addEventListener('click', addTask);
document.getElementById('inpTitle').addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });
</script>
</body>
</html>
